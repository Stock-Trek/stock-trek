[package]
name = "stock-trek"
version = "0.15.3"
edition = "2024"
rust-version = "1.88"
description = "Stock Trek time-series analysis"
authors = ["stock-trek.com <stock-trek@proton.me>"]
license = "MIT"
repository = "https://github.com/Stock-Trek/stock-trek"
readme = "README.md"
categories = ["finance", "mathematics"]
keywords = [
  "algorithm",
  "bot",
  "crypto",
  "quant",
  "trading",
]
exclude = [
  ".github/**",
  ".gitignore",
  "rust-toolchain.toml",
  "tests/**",
]

[lib]
name = "stock_trek"

[features]
default = ["dex"]
dex = ["dep:regex", "dep:regex-syntax", "dep:serde_with"]

[dependencies]
chrono = "0.4"
regex = { version = "1", optional = true }
regex-syntax = { version = "0.8", optional = true }
rust_decimal = "1"
serde = { version = "1", features = ["derive"] }
serde_with = { version = "3", optional = true }
stock-trek-types = { version = "0.5.3", features = ["serde"] }
strum = { version = "0.28", features = ["derive"] }
traitreg = "0.4"

[dev-dependencies]
serde_json = { version = "1", features = ["float_roundtrip"] }

[package.metadata.docs.rs]
default-target = "x86_64-unknown-linux-gnu"
features = ["dex"]
no-deps = true
targets = ["x86_64-unknown-linux-gnu"]

[[example]]
name = "cost_averaging"
test = true
