[package]
name = "stock-trek"
version = "0.15.2"
edition = "2024"
description = "Stock Trek time-series analysis"
authors = ["stock-trek.com <stock-trek@proton.me>"]
license = "MIT"
repository = "https://github.com/Stock-Trek/stock-trek"
readme = "README.md"
categories = ["finance", "mathematics"]
keywords = [
  "algorithm",
  "bot",
  "crypto",
  "quant",
  "trading",
]

[lib]
name = "stock_trek"
crate-type = ["cdylib", "rlib"]

[dependencies]
chrono = "0.4"
regex = "1"
rust_decimal = "1"
serde = "1"
serde_json = {version = "1", features = ["float_roundtrip"] }
serde_with = "3"
stock-trek-types = { version = "0.5", features = ["serde"] }
strum = { version = "0.28", features = ["derive"] }
traitreg = "0.4"

[lints.clippy]
module_inception = "allow"

[package.metadata.docs.rs]
default-target = "x86_64-unknown-linux-gnu"
features = []
no-deps = true
targets = ["x86_64-unknown-linux-gnu"]
