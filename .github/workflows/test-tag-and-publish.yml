name: Test, tag and publish

on:
  push:
    branches: [master]

permissions:
  contents: write
  id-token: write

jobs:
  test-tag-publish:
    name: Test, tag and publish
    runs-on: ubuntu-latest
    steps:
      - name: Get secrets
        uses: Infisical/secrets-action@v1.0.16
        with:
          method: "oidc"
          identity-id: "fafecebc-b41d-496d-915f-5ce536a6644b"
          project-slug: "publish"
          env-slug: "prod"

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        env:
          GITHUB_APP_CREATE_TAGS_CLIENT_ID: ${{ env.GITHUB_APP_CREATE_TAGS_CLIENT_ID }}
          GITHUB_APP_CREATE_TAGS_PRIVATE_KEY: ${{ env.GITHUB_APP_CREATE_TAGS_PRIVATE_KEY }}
        with:
          client-id: ${{ env.GITHUB_APP_CREATE_TAGS_CLIENT_ID }}
          private-key: ${{ env.GITHUB_APP_CREATE_TAGS_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-tags: true
          token: ${{ steps.app-token.outputs.token }}

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Run cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2

      - name: Run cargo-audit
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run checks
        run: |
          cargo fmt --check
          cargo clippy --all-targets --all-features -- -D warnings
          cargo test --all-features
          RUSTUP_TOOLCHAIN=1.88.0 cargo check --workspace
          RUSTDOCFLAGS="-D warnings" cargo doc --no-deps --all-features

      - name: Get version, check if tag exists, create and publish if not
        env:
          CARGO_REGISTRY_TOKEN: ${{ env.CARGO_REGISTRY_TOKEN }}
        run: |
          VERSION_MACROS=$(cargo pkgid -p stock-trek-macros | rev | cut -d '@' -f 1 | cut -d '#' -f 1 | rev)
          VERSION_ROOT=$(cargo pkgid -p stock-trek | rev | cut -d '@' -f 1 | cut -d '#' -f 1 | rev)
          TAG="v${VERSION_ROOT}"
          if git ls-remote --tags origin "refs/tags/${TAG}" | grep -q "refs/tags/${TAG}"; then
            echo "Tag ${TAG} already exists"
          else
            if curl -sfL -o /dev/null "https://crates.io/api/v1/crates/stock-trek-macros/${VERSION_MACROS}"; then
              echo "stock-trek-macros ${VERSION_MACROS} already published, skipping."
            else
              cargo publish -p stock-trek-macros
            fi
            if curl -sfL -o /dev/null "https://crates.io/api/v1/crates/stock-trek/${VERSION_ROOT}"; then
              echo "stock-trek ${VERSION_ROOT} already published, skipping."
            else
              cargo publish -p stock-trek
            fi
            echo "Creating tag ${TAG}"
            git config user.name "github-actions[bot]"
            git config user.email 'CreateTags[bot]@users.noreply.github.com'
            git tag "${TAG}"
            git push origin "${TAG}"
          fi
